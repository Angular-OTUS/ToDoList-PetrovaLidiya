<li 
    class="todolist-item"
    [ngClass]="{selected: item().id === selectedId()}"
>
    <div
        class="title"
        role="button"
        tabindex="0"
        (click)="itemClick(item().id)"
        (keydown)="itemClick(item().id)"
    >
        {{ item().title }}
    </div>
    <app-button-component
        [title]="'Удалить'"
        [cssClass]="'button--delete'"
        (buttonClick)="delete.emit()"
    ></app-button-component>
</li>
