<div class="todo-item-view w-100">
    <div class="d-flex justify-space-between align-items-start m-b-24">
        @if (isEditing()) {
            <div class="form-row p-16 d-flex gap-16 align-items-start w-100">
                <input
                    matInput
                    class="input-text"
                    type="text"
                    placeholder="Введите новое название задачи"
                    [(ngModel)]="editingTitle"
                    (keydown.enter)="saveNewTitle()"
                    (keydown.escape)="cancelEdit()"
                />
                <app-button-component
                    [type]="'accent'"
                    [size]="'small'"
                    (buttonClick)="saveNewTitle()"
                    appTooltip="Сохранить изменения в названии задачи"
                >Сохранить</app-button-component>
            </div>
        } @else {
            <div class="d-flex title-block align-items-start">
                <mat-checkbox
                    [checked]="isCompleted()"
                    (change)="onChange($event)"
                ></mat-checkbox>
                <h3
                    class="title"                
                    (dblclick)="setEditingMode()"
                >
                    {{ title() }}
                </h3>
            </div>
            <div class="p-t-8">
                <app-button-component
                    [type]="'danger'"
                    [size]="'small'"
                    (buttonClick)="delete()"
                    appTooltip="Удалить задачу из списка"
                >Удалить</app-button-component>
            </div>
        }
    </div>
    <div class="text">
        @if (description()) {
            {{ description() }}
        } @else {
            <i>Описание не указано</i>
        }
    </div>
</div>
